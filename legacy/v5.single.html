          <button class="btn btn-icon" data-act="remove" aria-label="Remover passo" data-tip="Remover">${icon('x', { size: 12 })}</button>
        </div>
      </div>
      ${expanded ? '<div class="step-body" data-body></div>' : ''}
    `;

    // Editor do passo (montado fora do innerHTML para preservar listeners).
    if (expanded) {
      const body = node.querySelector('[data-body]');
      body.append(
        createStepEditor(step, (patch) => {
          store.updateStep(step.id, patch, { skipHistory: true });
          onChange?.('step-edit');
          // Atualiza apenas o resumo do cabeçalho, sem recriar o editor.
          const summaryNode = node.querySelector('.step-summary');
          const nextSummary = summarizeStep({ ...step, ...patch });
          if (summaryNode) summaryNode.textContent = nextSummary;
        }),
      );
    }

    node.querySelector('[data-toggle]').addEventListener('click', () => {
      const current = store.getState().activeStepId;
      store.setActiveStep(current === step.id ? null : step.id);
    });

    node.querySelectorAll('[data-act]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        const action = button.dataset.act;
        if (action === 'toggle-enabled') store.toggleStep(step.id);
        else if (action === 'up') store.moveStep(step.id, -1);
        else if (action === 'down') store.moveStep(step.id, 1);
        else if (action === 'duplicate') store.duplicateStep(step.id);
        else if (action === 'remove') {
          store.removeStep(step.id);
          toast('Passo removido', { description: 'Ctrl+Z para desfazer', variant: 'info', duration: 2200 });
        }
        onChange?.('pipeline');
        render(true);
      });
    });

    /* ----------------------- drag & drop ----------------------- */
    node.addEventListener('dragstart', (event) => {
      dragIndex = index;
      node.style.opacity = '0.45';
      event.dataTransfer.effectAllowed = 'move';
      // Firefox exige dados para iniciar o drag
      event.dataTransfer.setData('text/plain', String(index));
    });
    node.addEventListener('dragend', () => {
      node.style.opacity = '';
      dragIndex = null;
      dropIndex = null;
      content.querySelectorAll('.step').forEach((item) => item.classList.remove('drop-target'));
    });
    node.addEventListener('dragover', (event) => {
      if (dragIndex === null) return;
      event.preventDefault();
      dropIndex = index;
      content.querySelectorAll('.step').forEach((item) => item.classList.remove('drop-target'));
      if (dragIndex !== index) node.classList.add('drop-target');
    });
    node.addEventListener('drop', (event) => {
      event.preventDefault();
      if (dragIndex === null || dragIndex === index) return;
      store.reorderSteps(dragIndex, index);
      onChange?.('reorder');
    });

    return node;
  }

  function render(force = false) {
    const state = store.getState();
    const { pipeline } = state;

    const nextSignature = signature(state);
    if (!force && nextSignature === lastSignature) {
      // Nada estrutural mudou: atualiza apenas os resumos visíveis.
      const list = content.querySelector('.steps');
      if (list) {
        pipeline.forEach((step, index) => {
          const card = list.querySelector(`[data-step-id="${step.id}"]`);
          const summary = card?.querySelector('.step-summary');
          if (summary) {
            const text = summarizeStep(step);
            summary.textContent = text;
            summary.title = text;
          }
          // Números e estado habilitado também podem mudar sem mudar a assinatura?
          // Não — ambos estão na assinatura, então aqui basta o resumo.
          void index;
        });
      }
      return;
    }
    lastSignature = nextSignature;

    stepCount.hidden = pipeline.length === 0;
    stepCount.textContent = `${pipeline.filter((step) => step.enabled !== false).length}/${pipeline.length}`;
    addWrap.hidden = pipeline.length === 0;

    if (!pipeline.length) {
      content.innerHTML = emptyState();
      return;
    }

    const list = document.createElement('ol');
    list.className = 'steps';
    pipeline.forEach((step, index) => list.append(stepCard(step, index, pipeline.length)));
    content.replaceChildren(list);

    // Mantém o menu aberto entre renders (se estava aberto).
    const wasOpen = root.querySelector('[data-menu]') && !root.querySelector('[data-menu]').hidden;
    const addHost = addWrap;
    addHost.querySelector('[data-menu]')?.remove();
    if (wasOpen) openMenu();
  }

  /* ---------------------------- Menu ---------------------------- */

  function openMenu() {
    addWrap.insertAdjacentHTML('beforeend', renderMenu());
    const menu = addWrap.querySelector('[data-menu]');
    menu.hidden = false;
    menu.querySelector('[data-kind]')?.focus();

    const closeMenu = () => {
      menu.remove();
      document.removeEventListener('mousedown', onOutside, true);
    };
    const onOutside = (event) => {
      if (!menu.contains(event.target) && !event.target.closest('[data-action="add-step"]')) closeMenu();
    };
    document.addEventListener('mousedown', onOutside, true);

    menu.addEventListener('click', (event) => {
      const item = event.target.closest('[data-kind]');
      if (!item) return;
      store.addStep(item.dataset.kind);
      onChange?.('add-step');
      render(true);
      closeMenu();
    });
  }

  /* --------------------------- Ações ---------------------------- */

  root.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;

    if (action === 'add-step') {
      const existing = addWrap.querySelector('[data-menu]');
      if (existing) existing.remove();
      else openMenu();
    } else if (action === 'clear-pipeline') {
      if (!store.getState().pipeline.length) return;
      store.clearPipeline();
      onChange?.('clear-pipeline');
      toast('Pipeline limpo', { description: 'Ctrl+Z para desfazer', variant: 'info' });
    } else if (action === 'load-recipe') {
      openRecipeDialog('load', { store, onChange });
    } else if (action === 'save-recipe') {
      openRecipeDialog('save', { store, onChange });
    }
  });

  render(true);
  const unsubscribe = store.subscribe(() => render());

  return {
    element: root,
    destroy: unsubscribe,
    /** Expande o pipeline até um passo específico (usado pela paleta de comandos). */
    focusStep: (id) => {
      store.setActiveStep(id);
      requestAnimationFrame(() => {
        root.querySelector(`[data-step-id="${id}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      });
    },
    scrollHost,
  };
}
return { createPipelinePanel: createPipelinePanel };
})();

/* ===== assets/js/ui/compareDialog.js ===== */
const __m_ui_compareDialog = (() => {
/**
 * Diff lado a lado completo (modal de inspeção).
 * Limita a 2000 linhas para manter a abertura instantânea; acima disso sugere
 * o filtro "Alterados".
 */

const { openModal } = __m_ui_modal;
const { icon } = __m_ui_icons;
const { escapeHtml, formatNumber, copyToClipboard, downloadFile } = __m_core_utils;
const { toast } = __m_ui_toast;

const MAX_ROWS = 2000;

function diffHtml(before, after) {
  if (before === after) return escapeHtml(after);
  const max = Math.min(before.length, after.length);
  let prefix = 0;
  while (prefix < max && before[prefix] === after[prefix]) prefix += 1;
  let suffix = 0;
  while (suffix < max - prefix && before[before.length - 1 - suffix] === after[after.length - 1 - suffix]) suffix += 1;

  const head = after.slice(0, prefix);
  const mid = after.slice(prefix, after.length - suffix);
  const tail = suffix ? after.slice(after.length - suffix) : '';
  return `${escapeHtml(head)}<mark>${escapeHtml(mid || '∅')}</mark>${escapeHtml(tail)}`;
}

function openCompare({ results }) {
  let mode = 'changed';

  const body = document.createElement('div');
  body.innerHTML = `
    <div class="row-flex wrap" style="margin-bottom:10px" data-modes></div>
    <div data-table></div>
    <p class="field-hint" data-limit-note hidden></p>
  `;

  const modesHost = body.querySelector('[data-modes]');
  const tableHost = body.querySelector('[data-table]');
  const limitNote = body.querySelector('[data-limit-note]');

  const changedCount = results.filter((result) => result.changed).length;
  const issueCount = results.filter((result) => result.issues.length > 0).length;

  const MODES = [
    { value: 'changed', label: `Alterados (${formatNumber(changedCount)})` },
    { value: 'all', label: `Todos (${formatNumber(results.length)})` },
    { value: 'issues', label: `Problemas (${formatNumber(issueCount)})` },
  ];

  const getFiltered = () => {
    const base = results.filter((result) => {
      if (mode === 'changed') return result.changed || result.removed;
      if (mode === 'issues') return result.issues.length > 0;
      return true;
    });
    return base.slice(0, MAX_ROWS);
  };

  const renderTable = () => {
    modesHost.innerHTML = MODES.map(
      (item) =>
        `<button class="btn btn-sm ${mode === item.value ? 'btn-secondary' : 'btn-ghost'}" data-mode="${item.value}">${item.label}</button>`,
    ).join('');

    const filtered = getFiltered();

    if (!filtered.length) {
      tableHost.innerHTML = `<p class="faint" style="padding:28px;text-align:center">Nenhuma mudança para mostrar neste filtro.</p>`;
      limitNote.hidden = true;
      return;
    }

    tableHost.innerHTML = `
      <div style="border:1px solid var(--border);border-radius:8px;overflow:hidden">
        <div style="display:grid;grid-template-columns:36px 1fr 1fr;background:var(--bg-panel);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--text-faint)">
          <div style="padding:5px 8px">#</div>
          <div style="padding:5px 8px;border-left:1px solid var(--border)">Original</div>
          <div style="padding:5px 8px;border-left:1px solid var(--border)">Novo</div>
        </div>
        <div style="max-height:52vh;overflow:auto;font-family:var(--font-mono);font-size:11.5px">
          ${filtered
            .map(
              (result, index) => `
            <div style="display:grid;grid-template-columns:36px 1fr 1fr;border-bottom:1px solid color-mix(in srgb, var(--border) 40%, transparent)">
              <div style="padding:4px 8px;font-size:10px;color:var(--text-faint)">${index + 1}</div>
              <div style="padding:4px 8px;border-left:1px solid color-mix(in srgb, var(--border) 60%, transparent);color:var(--text-dim);word-break:break-all">${escapeHtml(result.before) || '<em class="faint">(vazio)</em>'}</div>
              <div style="padding:4px 8px;border-left:1px solid color-mix(in srgb, var(--border) 60%, transparent);word-break:break-all">
                ${result.removed ? '<span class="badge badge-danger">removido</span>' : diffHtml(result.before, result.after)}
                ${result.issues.map((issue) => `<span class="badge ${issue.severity === 'error' ? 'badge-danger' : 'badge-warning'}">${escapeHtml(issue.code)}</span>`).join(' ')}
              </div>
            </div>`,
            )
            .join('')}
        </div>
      </div>
    `;

    const totalForMode =
      mode === 'changed'
        ? results.filter((result) => result.changed || result.removed).length
        : mode === 'issues'
          ? issueCount
          : results.length;
    limitNote.hidden = totalForMode <= MAX_ROWS;
    limitNote.textContent =
      totalForMode > MAX_ROWS
        ? `Exibindo as primeiras ${formatNumber(MAX_ROWS)} de ${formatNumber(totalForMode)} linhas.`
        : '';

    modesHost.querySelectorAll('[data-mode]').forEach((button) => {
      button.addEventListener('click', () => {
        mode = button.dataset.mode;
        renderTable();
      });
    });
  };

  renderTable();

  const footer = document.createElement('div');
  footer.className = 'row-flex';
  footer.style.width = '100%';
  footer.innerHTML = `
    <div class="left row-flex">
      <button class="btn btn-sm btn-ghost" data-act="csv">${icon('download')} Baixar CSV</button>
      <button class="btn btn-sm btn-ghost" data-act="copy">${icon('copy')} Copiar diff</button>
    </div>
    <button class="btn btn-sm btn-primary" data-close>Fechar</button>
  `;

  const modal = openModal({
    title: 'Comparar antes e depois',
    description: 'Revise as mudanças linha a linha, com destaque do trecho alterado.',
    size: 'wide',
    body,
    footer,
  });

  footer.querySelector('[data-close]').addEventListener('click', () => modal.close());

  footer.querySelector('[data-act="copy"]').addEventListener('click', async () => {
    const text = getFiltered().map((result) => `${result.before}\t${result.after}`).join('\n');
    const ok = await copyToClipboard(text);
    toast(ok ? 'Diff copiado (TSV)' : 'Falha ao copiar', { variant: ok ? 'success' : 'error' });
  });

  footer.querySelector('[data-act="csv"]').addEventListener('click', () => {
    const rows = ['original,novo'];
    for (const result of getFiltered()) {
      rows.push(`"${result.before.replace(/"/g, '""')}","${result.after.replace(/"/g, '""')}"`);
    }
    downloadFile('diff.csv', rows.join('\n'), 'text/csv;charset=utf-8');
  });
}
return { openCompare: openCompare };
})();

/* ===== assets/js/ui/previewPanel.js ===== */
const __m_ui_previewPanel = (() => {
/**
 * Painel de resultado: lista virtualizada + diff + estatísticas.
 *
 * VIRTUALIZAÇÃO (implementação própria, ~120 linhas)
 * Só renderizamos as linhas visíveis (+ overscan). Isso permite 100k linhas a
 * 60fps sem nenhuma biblioteca. Estratégia:
 *   - container com altura total = linhas * alturaDaLinha
 *   - cada linha posicionada com `translateY`, reciclada a cada scroll
 *   - um "pool" de nós evita criar/destruir elementos
 */

const { icon } = __m_ui_icons;
const { toast } = __m_ui_toast;
const { escapeHtml, formatNumber, debounce, copyToClipboard } = __m_core_utils;
const { openCompare } = __m_ui_compareDialog;

const ROW_HEIGHT = 30;
const OVERSCAN = 8;

function createPreviewPanel({ store, onChange, getPreview }) {
  const root = document.createElement('section');
  root.className = 'panel';
  root.id = 'panel-preview';
  root.setAttribute('aria-label', 'Resultado do processamento');

  root.innerHTML = `
    <div class="panel-header">

      <h2 class="panel-title">Resultado</h2>

      <div class="panel-spacer"></div>
      <button class="btn btn-icon" data-action="copy" data-tip="Copiar resultado" aria-label="Copiar resultado">${icon('copy')}</button>
      <button class="btn btn-icon" data-action="toggle-removed" data-tip="Mostrar/ocultar removidos" aria-label="Mostrar ou ocultar removidos">${icon('eye')}</button>
      <button class="btn btn-icon" data-action="compare" data-tip="Comparar lado a lado" aria-label="Comparar">${icon('scale')}</button>
    </div>

    <div class="preview-toolbar">
      <div class="search-wrap">
        ${icon('search', { size: 13 })}
        <input class="input" data-search type="search" placeholder="Filtrar itens… (Ctrl+Shift+F)" aria-label="Filtrar itens" />
        <button class="search-clear" data-action="clear-search" aria-label="Limpar filtro" hidden>${icon('x', { size: 11 })}</button>
      </div>
      <div class="filter-chips" role="group" aria-label="Filtro de linhas">
        <button data-filter="all" aria-pressed="true">Todos</button>
        <button data-filter="changed" aria-pressed="false">Alterados</button>
        <button data-filter="issues" aria-pressed="false">Problemas</button>
        <button data-filter="removed" aria-pressed="false">Removidos</button>
      </div>
    </div>

    <div class="list-scroll" data-scroll tabindex="0" role="region" aria-label="Lista de resultados">
      <div class="list-head" aria-hidden="true">
        <span>#</span>
        <span></span>
        <span>Original</span>
        <span></span>
        <span>Novo</span>
        <span>Status</span>
      </div>
      <div class="list-body" data-body></div>
      <div data-empty-preview hidden></div>
    </div>

    <div class="warn-bar" data-warn hidden>${icon('file-warning')}<span data-warn-text></span></div>

    <div class="list-footer">
      <div class="stat"><b data-stat="input">0</b><span>Entrada</span></div>
      <div class="stat accent"><b data-stat="output">0</b><span>Saída</span></div>
      <div class="stat success"><b data-stat="changed">0</b><span>Alterados</span></div>
      <div class="stat warning"><b data-stat="removed">0</b><span>Removidos</span></div>
      <div class="stat warning"><b data-stat="duplicates">0</b><span>Duplicados</span></div>
      <div class="stat danger"><b data-stat="invalid">0</b><span>Inválidos</span></div>
    </div>
  `;

  const body = root.querySelector('[data-body]');
  const scroll = root.querySelector('[data-scroll]');
  const emptyBox = root.querySelector("[data-empty-preview]");
  const searchInput = root.querySelector('[data-search]');
  const clearSearch = root.querySelector('[data-action="clear-search"]');
  const changedBadge = root.querySelector('[data-changed-badge]');
  const workerBadge = root.querySelector('[data-worker-badge]');
  const warnBar = root.querySelector('[data-warn]');
  const warnText = root.querySelector('[data-warn-text]');

  /** @type {{filtered: object[], preview: object}} */
  let view = { filtered: [], preview: { results: [], stats: {} } };
  let rendered = new Map(); // index -> element
  let lastRange = { start: -1, end: -1 };
  let filter = 'all';

  /* ------------------------- Filtro & busca ------------------------- */

  function computeFiltered() {
    const { preview } = view;
    const query = store.getState().searchQuery.trim().toLowerCase();
    const showRemoved = store.getState().preferences.showRemoved;

    return preview.results.filter((result) => {
      if (!showRemoved && result.removed) return false;
      if (filter === 'changed' && !result.changed) return false;
      if (filter === 'issues' && result.issues.length === 0) return false;
      if (filter === 'removed' && !result.removed) return false;
      if (!query) return true;
      return result.before.toLowerCase().includes(query) || result.after.toLowerCase().includes(query);
    });
  }

  /* --------------------------- Virtualização ------------------------- */

  function createRow() {
    const node = document.createElement('div');
    node.className = 'row';
    node.innerHTML = `
      <span class="row-num"></span>
      <button class="row-lock" aria-label="Travar linha">${icon('lock', { size: 11 })}</button>
      <span class="cell cell-before"></span>
      <span class="cell-arrow">${icon('arrow-right', { size: 11 })}</span>
      <span class="cell cell-after"></span>
      <span class="row-status"></span>
    `;
    node.querySelector('.row-lock').addEventListener('click', (event) => {
      event.stopPropagation();
      const id = node.dataset.rowId;
      if (id) {
        store.toggleRowLock(id);
        renderRows(true);
      }
    });
    node.addEventListener('click', (event) => {
      const id = node.dataset.rowId;
      if (!id) return;
      store.toggleRowSelect(id, event.shiftKey || event.metaKey || event.ctrlKey);
    });
    return node;
  }

  /** Renderiza o highlight de diff de forma barata (prefixo/sufixo comum). */
  function diffHtml(before, after) {
    if (before === after) return escapeHtml(after);

    const max = Math.min(before.length, after.length);
    let prefix = 0;
    while (prefix < max && before[prefix] === after[prefix]) prefix += 1;

    let suffix = 0;
    while (suffix < max - prefix && before[before.length - 1 - suffix] === after[after.length - 1 - suffix]) suffix += 1;

    const head = after.slice(0, prefix);
    const mid = after.slice(prefix, after.length - suffix);
    const tail = suffix ? after.slice(after.length - suffix) : '';

    return `${escapeHtml(head)}<mark>${escapeHtml(mid || '∅')}</mark>${escapeHtml(tail)}`;
  }

  function fillRow(node, result, index) {
    const selected = store.getState().rows.find((row) => row.id === result.id)?.selected;
    node.dataset.rowId = result.id;
    node.className = `row ${result.removed ? 'removed' : ''} ${selected ? 'selected' : ''}`;
    node.style.transform = `translateY(${index * ROW_HEIGHT}px)`;

    node.querySelector('.row-num').textContent = index + 1;

    const lock = node.querySelector('.row-lock');
    lock.classList.toggle('locked', Boolean(result.locked));
    lock.setAttribute('aria-label', result.locked ? 'Destravar linha' : 'Travar linha');
    lock.innerHTML = icon(result.locked ? 'lock' : 'unlock', { size: 11 });

    const beforeCell = node.querySelector('.cell-before');
    beforeCell.textContent = result.before || '(vazio)';
    beforeCell.title = result.before;

    const afterCell = node.querySelector('.cell-after');
    afterCell.innerHTML = result.changed ? diffHtml(result.before, result.after) : escapeHtml(result.after);
    afterCell.title = result.after;

    const status = node.querySelector('.row-status');
    if (result.removed) {
      status.innerHTML = `<span class="badge badge-danger">removido</span>`;
    } else if (result.issues.some((issue) => issue.severity === 'error')) {
      status.innerHTML = `<span class="status-error" title="${escapeHtml(result.issues.map((i) => i.message).join(' · '))}">${icon('x-circle', { size: 12 })}</span>`;
    } else if (result.issues.length) {
      status.innerHTML = `<span class="status-warn" title="${escapeHtml(result.issues.map((i) => i.message).join(' · '))}">${icon('alert-triangle', { size: 12 })}</span>`;
    } else if (result.changed) {
      status.innerHTML = `<span class="status-ok" title="Alterado">${icon('check', { size: 12 })}</span>`;
    } else {
      status.innerHTML = '';
    }
  }

  /** Atualiza somente as linhas na janela visível (reciclando nós). */
  function renderRows(force = false) {
    const total = view.filtered.length;
    body.style.height = `${total * ROW_HEIGHT}px`;

    if (!total) {
      rendered.forEach((node) => node.remove());
      rendered.clear();
      return;
    }

    const scrollTop = scroll.scrollTop;
    const viewport = scroll.clientHeight || 400;
    const start = Math.max(0, Math.floor(scrollTop / ROW_HEIGHT) - OVERSCAN);
    const end = Math.min(total, Math.ceil((scrollTop + viewport) / ROW_HEIGHT) + OVERSCAN);

    if (!force && start === lastRange.start && end === lastRange.end) {
      // Mesma janela: só atualiza conteúdo (mudanças de seleção/diff).
      for (let i = start; i < end; i += 1) {
        const node = rendered.get(i);
        if (node) fillRow(node, view.filtered[i], i);
      }
      return;
    }

    // Remove nós fora da janela
    for (const [index, node] of rendered) {
      if (index < start || index >= end) {
        node.remove();
        rendered.delete(index);
      }
    }

    // Cria/reaproveita nós dentro da janela
    for (let i = start; i < end; i += 1) {
      let node = rendered.get(i);
      if (!node) {
        node = createRow();
        body.append(node);
        rendered.set(i, node);
      }
      fillRow(node, view.filtered[i], i);
    }

    lastRange = { start, end };
  }

  const onScroll = () => renderRows();

  // requestAnimationFrame evita múltiplos renders por frame no scroll rápido.
  let scrollScheduled = false;
  scroll.addEventListener(
    'scroll',
    () => {
      if (scrollScheduled) return;
      scrollScheduled = true;
      requestAnimationFrame(() => {
        scrollScheduled = false;
        onScroll();
      });
    },
    { passive: true },
  );

  const onResize = debounce(() => renderRows(true), 120);
  window.addEventListener('resize', onResize);

  /* ----------------------------- Render ----------------------------- */

  function renderEmpty() {
    const { preview } = view;
    const hasRows = preview.results.length > 0;

    if (store.getState().rows.length === 0) {
      emptyBox.hidden = false;
      emptyBox.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${icon('sparkles', { size: 20 })}</div>
          <h3>A prévia aparece aqui</h3>
          <p>Cole nomes na entrada e adicione passos ao pipeline. Tudo é calculado localmente, em tempo real.</p>
        </div>
      `;
      body.innerHTML = '';
      return;
    }

    if (!hasRows || view.filtered.length === 0) {
      emptyBox.hidden = false;
      const query = store.getState().searchQuery;
      emptyBox.innerHTML = `
        <div class="empty">
          <div class="empty-icon">${icon('search', { size: 20 })}</div>
          <h3>Nenhum item corresponde ao filtro</h3>
          <p>${query ? `Nada encontrado para "${escapeHtml(query)}".` : 'Tente outro filtro.'}</p>
          <div class="empty-actions">
            <button class="btn btn-sm btn-ghost" data-clear-filters>Limpar filtros</button>
          </div>
        </div>
      `;
      emptyBox.querySelector('[data-clear-filters]')?.addEventListener('click', () => {
        searchInput.value = '';
        store.setUI({ searchQuery: '' });
        setFilter('all');
      });
      body.innerHTML = '';
      return;
    }

    emptyBox.hidden = true;
  }

  function setFilter(next) {
    filter = next;
    root.querySelectorAll('[data-filter]').forEach((button) => {
      button.setAttribute('aria-pressed', String(button.dataset.filter === next));
    });
    view.filtered = computeFiltered();
    lastRange = { start: -1, end: -1 };
    renderRows(true);
    renderEmpty();
  }

  function renderStats() {
    const stats = view.preview.stats ?? {};
    const put = (key, value) => {
      const node = root.querySelector(`[data-stat="${key}"]`);
      if (node) node.textContent = formatNumber(value ?? 0);
    };
    put('input', stats.inputLines);
    put('output', stats.outputLines);
    put('changed', stats.changed);
    put('removed', stats.removed);
    put('duplicates', stats.duplicates);
    put('invalid', stats.invalid);

    changedBadge.hidden = !stats.changed;
    changedBadge.textContent = `${formatNumber(stats.changed)} alterado(s)`;
    changedBadge.className = `badge ${stats.changed ? 'badge-accent' : ''}`;

    const invalid = stats.invalid ?? 0;
    const isFilenames = store.getState().preferences.contentMode === 'filenames';
    warnBar.hidden = !(invalid > 0 && isFilenames);
    if (!warnBar.hidden) {
      warnText.textContent = `${formatNumber(invalid)} nome(s) inválido(s) para o sistema de arquivos — corrija antes de aplicar.`;
    }

    workerBadge.hidden = !view.preview.usingWorker;
  }

  function render() {
    const state = store.getState();
    searchInput.value = state.searchQuery;
    clearSearch.hidden = !state.searchQuery;

    view.filtered = computeFiltered();
    lastRange = { start: -1, end: -1 };
    renderRows(true);
    renderEmpty();
    renderStats();
  }

  /** Chamado pelo app quando um novo preview é calculado. */
  function setPreview(preview) {
    const keepScroll = scroll.scrollTop;
    view.preview = preview;
    view.filtered = computeFiltered();
    lastRange = { start: -1, end: -1 };
    body.innerHTML = '';
    rendered.clear();
    renderRows(true);
    // Preserva a posição de leitura: recalcular a cada tecla não deve jogar o
    // usuário de volta ao topo da lista.
    if (scroll.scrollTop !== keepScroll) scroll.scrollTop = keepScroll;
    renderEmpty();
    renderStats();
  }

  /* ----------------------------- Eventos ----------------------------- */

  const onSearch = debounce(() => {
    store.setUI({ searchQuery: searchInput.value });
    view.filtered = computeFiltered();
    lastRange = { start: -1, end: -1 };
    body.innerHTML = '';
    rendered.clear();
    renderRows(true);
    renderEmpty();
  }, 120);

  searchInput.addEventListener('input', () => {
    clearSearch.hidden = !searchInput.value;
    onSearch();
  });

  root.querySelectorAll('[data-filter]').forEach((button) => {
    button.addEventListener('click', () => setFilter(button.dataset.filter));
  });

  root.addEventListener('click', async (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;

    if (action === 'clear-search') {
      searchInput.value = '';
      store.setUI({ searchQuery: '' });
      clearSearch.hidden = true;
      onSearch.flush();
      searchInput.focus();
    } else if (action === 'copy') {
      const text = view.preview.results
        .filter((result) => !result.removed)
        .map((result) => result.after)
        .join('\n');
      if (!text) {
        toast('Nada para copiar', { variant: 'warning' });
        return;
      }
      const ok = await copyToClipboard(text);
      toast(ok ? 'Lista copiada!' : 'Falha ao copiar', {
        description: ok ? `${formatNumber(view.preview.stats.outputLines)} itens` : undefined,
        variant: ok ? 'success' : 'error',
      });
    } else if (action === 'toggle-removed') {
      store.setPreference('showRemoved', !store.getState().preferences.showRemoved);
      onChange?.('toggle-removed');
    } else if (action === 'compare') {
      openCompare({ results: view.preview.results });
    }
  });

  const unsubscribe = store.subscribe(() => {
    // Só re-renderiza a lista quando algo visual relevante muda.
    render();
  });

  return {
    element: root,
    setPreview,
    render,
    focusSearch: () => searchInput.focus(),
    scrollToTop: () => {
      scroll.scrollTop = 0;
      renderRows(true);
    },
    destroy: () => {
      unsubscribe();
      window.removeEventListener('resize', onResize);
    },
  };
}
return { createPreviewPanel: createPreviewPanel };
})();

            <div class="row-flex wrap" style="gap:10px">
              <label class="check"><input type="checkbox" data-opt="dryRun" checked /><span>Dry-run</span></label>
              <label class="check"><input type="checkbox" data-opt="avoidOverwrite" checked /><span>Não sobrescrever</span></label>
              <label class="check"><input type="checkbox" data-opt="backup" /><span>Backup .bak</span></label>
              <label class="check"><input type="checkbox" data-opt="log" checked /><span>Log</span></label>
            </div>
          </div>
        </div>

        <div class="field">
          <div class="field-label-row">
            <span class="field-label">Prévia do script</span>
            <span class="badge" data-script-count></span>
          </div>
          <pre data-script-preview class="mono" style="max-height:34vh;overflow:auto;margin:0;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);font-size:11px;line-height:1.6;white-space:pre"></pre>
        </div>
      </div>
    </div>

    <div data-panel="list" class="tab-panel" style="padding-top:10px">
      <div class="stack">
        <div class="field">
          <div class="field-label-row"><span class="field-label">Formato</span></div>
          <div class="row-flex wrap" data-formats></div>
        </div>
        <div class="field">
          <div class="field-label-row"><span class="field-label">Prévia</span></div>
          <pre data-list-preview class="mono" style="max-height:38vh;overflow:auto;margin:0;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-input);font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all"></pre>
        </div>
      </div>
    </div>

    <div data-panel="apply" class="tab-panel" style="padding-top:10px">
      <div class="stack" data-apply-content></div>
    </div>
  `;

  const tabs = body.querySelector('.tabs');
  const scriptPanel = body.querySelector('[data-panel="script"]');
  const listPanel = body.querySelector('[data-panel="list"]');
  const applyPanel = body.querySelector('[data-panel="apply"]');

  /* ---------------------------- Tabs ---------------------------- */
  body.querySelectorAll('[data-tab]').forEach((tab) => {
    tab.addEventListener('click', () => {
      body.querySelectorAll('[data-tab]').forEach((other) => other.setAttribute('aria-selected', String(other === tab)));
      for (const panel of [scriptPanel, listPanel, applyPanel]) {
        panel.classList.toggle('active', panel.dataset.panel === tab.dataset.tab);
      }
    });
  });

  /* --------------------------- Script --------------------------- */

  const langsHost = scriptPanel.querySelector('[data-langs]');
  const preview = scriptPanel.querySelector('[data-script-preview]');
  const scriptCount = scriptPanel.querySelector('[data-script-count]');
  const dirInput = scriptPanel.querySelector('#opt-dir');

  const opts = { dryRun: true, avoidOverwrite: true, backup: false, log: true };

  const currentScript = () =>
    generateScript(language, changedPairs, {
      ...opts,
      directory: dirInput.value.trim(),
    });

  function renderScript() {
    langsHost.innerHTML = Object.entries(SCRIPT_META)
      .map(
        ([key, meta]) =>
          `<button class="btn btn-sm ${key === language ? 'btn-secondary' : 'btn-ghost'}" data-lang="${key}" data-tip="${escapeHtml(meta.hint)}">${escapeHtml(meta.label)}</button>`,
      )
      .join('');

    for (const button of langsHost.querySelectorAll('[data-lang]')) {
      button.addEventListener('click', () => {
        language = button.dataset.lang;
        renderScript();
      });
    }

    scriptCount.textContent = `${changedPairs.length} renomeação(ões)`;
    preview.textContent = changedPairs.length
      ? currentScript()
      : 'Nada para renomear — o resultado é idêntico à entrada.';
  }

  dirInput.addEventListener('input', () => {
    preview.textContent = changedPairs.length ? currentScript() : preview.textContent;
  });

  for (const checkbox of scriptPanel.querySelectorAll('[data-opt]')) {
    checkbox.addEventListener('change', () => {
      opts[checkbox.dataset.opt] = checkbox.checked;
      renderScript();
    });
  }

  renderScript();

  /* ---------------------------- Lista ---------------------------- */

  let format = 'txt';
  const formatsHost = listPanel.querySelector('[data-formats]');
  const listPreview = listPanel.querySelector('[data-list-preview]');

  function renderList() {
    formatsHost.innerHTML = Object.entries(LIST_FORMATS)
      .map(
        ([key, meta]) =>
          `<button class="btn btn-sm ${key === format ? 'btn-secondary' : 'btn-ghost'}" data-format="${key}">${escapeHtml(meta.label)}</button>`,
      )
      .join('');

    for (const button of formatsHost.querySelectorAll('[data-format]')) {
      button.addEventListener('click', () => {
        format = button.dataset.format;
        renderList();
      });
    }

    const text = exportResults(results, format, stats);
    listPreview.textContent = text.slice(0, 4000) + (text.length > 4000 ? '\n…' : '');
  }

  renderList();

  /* ---------------------------- Aplicar --------------------------- */

  const applyHost = applyPanel.querySelector('[data-apply-content]');
  const hasFsApi = 'showDirectoryPicker' in window;

  function renderApply() {
    const invalid = results.filter(
      (result) => !result.removed && result.issues.some((issue) => issue.severity === 'error'),
    ).length;

    applyHost.innerHTML = `
      <div class="preview-box">
        <div class="label">Resumo</div>
        <div class="value" style="margin-top:4px">
          ${formatNumber(alive.length)} arquivo(s) na pasta • ${formatNumber(changedPairs.length)} serão renomeados
          ${invalid ? `<br><span style="color:var(--danger)">${formatNumber(invalid)} nome(s) inválido(s) — corrija antes de aplicar</span>` : ''}
        </div>
      </div>

      ${
        hasFsApi
          ? `
        <p class="field-hint">
          O navegador pedirá permissão para ler a pasta. Nada é enviado para servidores — a renomeação
          acontece localmente, arquivo por arquivo, com verificação de conflitos.
        </p>
        <label class="switch" for="apply-backup">
          <input id="apply-backup" type="checkbox" />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text"><strong>Criar cópia .bak antes</strong><span>Recomendado para a primeira execução</span></span>
        </label>
        <label class="switch" for="apply-dry">
          <input id="apply-dry" type="checkbox" checked />
          <span class="switch-track" aria-hidden="true"></span>
          <span class="switch-text"><strong>Simular (dry-run)</strong><span>Mostra o que faria, sem alterar nada</span></span>
        </label>
        <div class="row-flex">
          <button class="btn btn-primary" data-act="apply" ${invalid || !changedPairs.length ? 'disabled' : ''}>
            ${icon('folder-open')} Escolher pasta e aplicar
          </button>
        </div>
        <div class="field-hint" data-apply-log style="font-family:var(--font-mono);max-height:160px;overflow:auto;white-space:pre-wrap"></div>
      `
          : `
        <div class="warn-bar" style="border-radius:8px;border:1px solid color-mix(in srgb, var(--warning) 30%, transparent);background:color-mix(in srgb, var(--warning) 10%, transparent);color:var(--warning)">
          ${icon('alert-triangle')}
          <span>Seu navegador não suporta a File System Access API. Use o script gerado (aba Script) ou o Chrome/Edge no desktop.</span>
        </div>
        <button class="btn btn-secondary" data-act="goto-script">${icon('terminal')} Ir para o script</button>
      `
      }
    `;

    applyHost.querySelector('[data-act="goto-script"]')?.addEventListener('click', () => {
      body.querySelector('[data-tab="script"]').click();
    });

    applyHost.querySelector('[data-act="apply"]')?.addEventListener('click', runApply);
  }

  async function runApply() {
    const button = applyHost.querySelector('[data-act="apply"]');
    const logHost = applyHost.querySelector('[data-apply-log]');
    const dryRun = applyHost.querySelector('#apply-dry').checked;
    const backup = applyHost.querySelector('#apply-backup').checked;

    const log = (message) => {
      logHost.textContent += `${message}\n`;
      logHost.scrollTop = logHost.scrollHeight;
    };

    button.disabled = true;
    logHost.textContent = '';

    try {
      const directory = await window.showDirectoryPicker({ mode: 'readwrite' });
      log(`📁 Pasta: ${directory.name}`);

      // Mapa dos arquivos existentes (case-insensitive para evitar conflito).
      const existing = new Map();
      for await (const [name] of directory.entries()) {
        if (name.endsWith('.bak')) continue;
        existing.set(name.toLowerCase(), name);
      }

      let renamed = 0;
      let skipped = 0;
      let failed = 0;
      const usedNames = new Set(existing.keys());

      for (const pair of changedPairs) {
        const fromKey = pair.from.toLowerCase();
        if (!existing.has(fromKey)) {
          log(`⏭  ${pair.from}: não encontrado na pasta`);
          skipped += 1;
          continue;
        }

        const targetKey = pair.to.toLowerCase();
        if (usedNames.has(targetKey) && targetKey !== fromKey) {
          log(`⏭  ${pair.to}: já existe (não sobrescrevo)`);
          skipped += 1;
          continue;
        }

        if (dryRun) {
          log(`🧪 ${pair.from} → ${pair.to}`);
          continue;
        }

        try {
          const fileHandle = await directory.getFileHandle(existing.get(fromKey));
          const file = await fileHandle.getFile();

          if (backup) {
            const backupHandle = await directory.getFileHandle(`${file.name}.bak`, { create: true });
            const writable = await backupHandle.createWritable();
            await writable.write(await file.arrayBuffer());
            await writable.close();
          }

          const targetHandle = await directory.getFileHandle(pair.to, { create: true });
          const writable = await targetHandle.createWritable();
          await writable.write(await file.arrayBuffer());
          await writable.close();

          await directory.removeEntry(file.name);
          usedNames.delete(fromKey);
          usedNames.add(targetKey);
          existing.set(targetKey, pair.to);
          existing.delete(fromKey);
          renamed += 1;
          log(`✅ ${pair.from} → ${pair.to}`);
        } catch (error) {
          failed += 1;
          log(`❌ ${pair.from}: ${error.message}`);
        }
      }

      log('');
      log(
        dryRun
          ? `Simulação concluída: ${changedPairs.length - skipped} seriam renomeados, ${skipped} ignorado(s).`
          : `Concluído: ${renamed} renomeado(s), ${skipped} ignorado(s), ${failed} falha(s).`,
      );

      toast(dryRun ? 'Simulação concluída' : `${renamed} arquivo(s) renomeado(s)`, {
        description: skipped ? `${skipped} ignorado(s)` : undefined,
        variant: failed ? 'warning' : 'success',
        duration: 6000,
      });
    } catch (error) {
      if (error.name !== 'AbortError') {
        log(`Erro: ${error.message}`);
        toast('Falha ao aplicar', { description: error.message, variant: 'error' });
      }
    } finally {
      button.disabled = false;
    }
  }

  renderApply();

  /* ---------------------------- Footer ---------------------------- */

  const footer = document.createElement('div');
  footer.className = 'row-flex';
  footer.style.width = '100%';
  footer.innerHTML = `
    <div class="left row-flex wrap">
      <button class="btn btn-sm btn-ghost" data-act="copy">${icon('copy')} Copiar</button>
      <button class="btn btn-sm btn-ghost" data-act="download">${icon('download')} Baixar</button>
    </div>
    <button class="btn btn-sm btn-primary" data-close>Concluir</button>
  `;

  const activeTab = () => body.querySelector('.tab[aria-selected="true"]').dataset.tab;

  const modal = openModal({
    title: 'Exportar resultado',
    description: `${formatNumber(changedPairs.length)} renomeação(ões) · ${formatNumber(alive.length)} item(ns) na saída`,
    size: 'wide',
    body,
    footer,
  });

  // Remove os painéis do fluxo das tabs para o layout do modal.
  const bodyHost = modal.element.querySelector('.modal-body');
  bodyHost.prepend(tabs);

  footer.querySelector('[data-close]').addEventListener('click', () => modal.close());

  footer.querySelector('[data-act="copy"]').addEventListener('click', async () => {
    const tab = activeTab();
    const text =
      tab === 'list'
        ? exportResults(results, format, stats)
        : tab === 'script'
          ? currentScript()
          : results
              .filter((result) => !result.removed)
              .map((result) => result.after)
              .join('\n');
    const ok = await copyToClipboard(text);
    toast(ok ? 'Copiado para o clipboard' : 'Falha ao copiar', { variant: ok ? 'success' : 'error' });
  });

  footer.querySelector('[data-act="download"]').addEventListener('click', () => {
    const tab = activeTab();

    if (tab === 'list') {
      const meta = LIST_FORMATS[format];
      downloadFile(meta.filename, exportResults(results, format, stats), meta.mime);
      toast('Lista baixada', { description: meta.filename, variant: 'success' });
      return;
    }

    if (tab === 'script') {
      const meta = SCRIPT_META[language];
      downloadFile(meta.filename, currentScript(), meta.mime);
      toast('Script baixado', {
        description: `${meta.filename} — leia o cabeçalho antes de executar`,
        variant: 'success',
      });
      return;
    }

    // Aba aplicar: oferece o mapa de-para em CSV (útil para planilhas).
    downloadFile('mapa_de_para.csv', exportRenameMap(results), 'text/csv;charset=utf-8');
    toast('Mapa de-para baixado', { variant: 'success' });
  });

  // Garante que o store está disponível para futuros ganchos (ex.: telemetria local).
  void store;
}
return { openExportDialog: openExportDialog };
})();

/* ===== assets/js/ui/commandPalette.js ===== */
const __m_ui_commandPalette = (() => {
/**
 * Command palette (Ctrl+K).
 *
 * Ações são registradas pelo app (não pelo módulo) para que a paleta não
 * conheça detalhes de implementação — fácil de estender e testar.
 */

const { openModal } = __m_ui_modal;
const { icon } = __m_ui_icons;
const { escapeHtml } = __m_core_utils;

/**
 * @param {{ actions: {id:string,label:string,group?:string,hint?:string,icon?:string,run:Function}[], initialQuery?: string }} config
 */
function openCommandPalette({ actions, initialQuery = '' }) {
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="cmdk-input">
      ${icon('search', { size: 15 })}
      <input type="text" placeholder="Digite um comando…" aria-label="Buscar comando" autocomplete="off" />
      <kbd>Esc</kbd>
    </div>
    <div class="cmdk-list" role="listbox" aria-label="Comandos"></div>
  `;

  const input = body.querySelector('input');
  const list = body.querySelector('.cmdk-list');

  let filtered = actions;
  let activeIndex = 0;

  const modal = openModal({
    title: 'Paleta de comandos',
    body,
    bare: true,
    initialFocus: '.cmdk-input input',
  });

  // Esconde o cabeçalho padrão: a paleta usa o próprio campo de busca.
  modal.element.querySelector('.modal-head').style.display = 'none';

  function renderList() {
    if (!filtered.length) {
      list.innerHTML = `<p class="cmdk-empty">Nenhum comando encontrado.</p>`;
      return;
    }

    let lastGroup = null;
    list.innerHTML = filtered
      .map((action, index) => {
        const group = action.group ?? 'Geral';
        const header = group !== lastGroup ? `<div class="cmdk-group">${escapeHtml(group)}</div>` : '';
        lastGroup = group;
        return `${header}
          <button class="cmdk-item" role="option" aria-selected="${index === activeIndex}" data-index="${index}">
            ${icon(action.icon ?? 'sparkles', { size: 14 })}
            <span>${escapeHtml(action.label)}</span>
            ${action.hint ? `<span class="hint">${escapeHtml(action.hint)}</span>` : ''}
          </button>`;
      })
      .join('');

    list.querySelectorAll('[data-index]').forEach((button) => {
      button.addEventListener('click', () => run(Number(button.dataset.index)));
      button.addEventListener('mouseenter', () => {
        activeIndex = Number(button.dataset.index);
        highlight();
      });
    });
  }

  function highlight() {
    list.querySelectorAll('[data-index]').forEach((button) => {
      button.setAttribute('aria-selected', String(Number(button.dataset.index) === activeIndex));
    });
    list.querySelector('[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' });
  }

  function filterActions(query) {
    const needle = query.trim().toLowerCase();
    if (!needle) return actions;
    return actions.filter((action) => {
      const haystack = `${action.label} ${action.group ?? ''} ${action.hint ?? ''}`.toLowerCase();
      return haystack.includes(needle);
    });
  }

  function run(index) {
    const action = filtered[index];
    if (!action) return;
    modal.close();
    // Executa após o fechamento para o foco voltar corretamente.
    setTimeout(() => action.run(), 10);
  }

  input.value = initialQuery;
  filtered = filterActions(initialQuery);
  renderList();

  input.addEventListener('input', () => {
    filtered = filterActions(input.value);
    activeIndex = 0;
    renderList();
  });

  input.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowDown') {
      event.preventDefault();
      activeIndex = Math.min(activeIndex + 1, filtered.length - 1);
      highlight();
    } else if (event.key === 'ArrowUp') {
      event.preventDefault();
      activeIndex = Math.max(activeIndex - 1, 0);
      highlight();
    } else if (event.key === 'Enter') {
      event.preventDefault();
      run(activeIndex);
    }
  });

  return modal;
}
return { openCommandPalette: openCommandPalette };
})();

/* --------------------------- Estatísticas --------------------------- */

function openStats({ results, stats, pipeline }) {
  const alive = results.filter((result) => !result.removed);
  const issuesByCode = new Map();
  for (const result of results) {
    for (const issue of result.issues) {
      issuesByCode.set(issue.code, (issuesByCode.get(issue.code) ?? 0) + 1);
    }
  }

  const longest = alive.reduce((max, result) => (result.after.length > max.length ? result.after : max), '');
  const shortest = alive.reduce(
    (min, result) => (result.after.length < min.length ? result.after : min),
    alive[0]?.after ?? '',
  );

  const rows = [
    ['Itens na entrada', formatNumber(stats.inputLines)],
    ['Itens na saída', formatNumber(stats.outputLines)],
    ['Alterados', formatNumber(stats.changed)],
    ['Inalterados', formatNumber(stats.unchanged)],
    ['Removidos', formatNumber(stats.removed)],
    ['Duplicados na saída', formatNumber(stats.duplicates)],
    ['Nomes inválidos', formatNumber(stats.invalid)],
    ['Comprimento médio', `${stats.avgLength} caracteres`],
    ['Comprimento máximo', `${stats.maxLength} caracteres`],
    ['Passos no pipeline', `${pipeline.filter((step) => step.enabled !== false).length} de ${pipeline.length}`],
  ];

  const body = document.createElement('div');
  body.innerHTML = `
    <div style="display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:12.5px">
      ${rows.map(([label, value]) => `<span class="faint">${escapeHtml(label)}</span><strong class="mono" style="font-weight:600">${value}</strong>`).join('')}
    </div>

    ${
      issuesByCode.size
        ? `<div style="margin-top:14px">
            <p class="field-label" style="margin-bottom:6px">Problemas encontrados</p>
            <div class="chips">${[...issuesByCode.entries()]
              .map(([code, count]) => `<span class="badge badge-warning">${escapeHtml(code)}: ${count}</span>`)
              .join('')}</div>
          </div>`
        : ''
    }

    ${
      pipeline.length
        ? `<div style="margin-top:14px">
            <p class="field-label" style="margin-bottom:6px">Pipeline</p>
            <div class="chips">${pipeline
              .map(
                (step, index) =>
                  `<span class="chip" style="${step.enabled === false ? 'opacity:.5;text-decoration:line-through' : ''}">${index + 1}. ${escapeHtml(STEP_META[step.kind]?.label ?? step.kind)}</span>`,
              )
              .join('')}</div>
          </div>`
        : ''
    }

    ${
      alive.length
        ? `<div style="margin-top:14px">
            <p class="field-label" style="margin-bottom:6px">Extremos</p>
            <p class="small dim" style="word-break:break-all">
              <strong>Mais longo:</strong> <span class="mono">${escapeHtml(longest)}</span><br />
              <strong>Mais curto:</strong> <span class="mono">${escapeHtml(shortest)}</span>
            </p>
          </div>`
        : ''
    }
  `;

  openModal({
    title: 'Estatísticas da lista',
    description: 'Um raio-x do seu processamento atual.',
    body,
  });
}

/* ---------------------------- Histórico ---------------------------- */

function openTimeline({ history, historyIndex, onJump }) {
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="recipe-list">
      ${history
        .map(
          (snapshot, index) => `

const __m_ui_theme = (() => {
/**
 * Tema claro/escuro/sistema + cor de destaque.
 * Tudo via CSS custom properties: trocar de tema não re-renderiza nada.
 */

const ACCENTS = {
  violet: { label: 'Violeta', base: '#a78bfa', strong: '#8b5cf6', soft: 'rgba(167,139,250,0.14)' },
  blue: { label: 'Azul', base: '#60a5fa', strong: '#3b82f6', soft: 'rgba(96,165,250,0.14)' },
  emerald: { label: 'Esmeralda', base: '#34d399', strong: '#10b981', soft: 'rgba(52,211,153,0.14)' },
  amber: { label: 'Âmbar', base: '#fbbf24', strong: '#f59e0b', soft: 'rgba(251,191,36,0.14)' },
  rose: { label: 'Rosa', base: '#fb7185', strong: '#f43f5e', soft: 'rgba(251,113,133,0.14)' },
  cyan: { label: 'Ciano', base: '#22d3ee', strong: '#06b6d4', soft: 'rgba(34,211,238,0.14)' },
};

let mediaQuery = null;
let mediaHandler = null;

/**
 * Resolve o tema efetivo.
 * Modo 'system' respeita `prefers-color-scheme`. Se o usuário nunca escolheu,
 * usamos 'system' como padrão (ver store) para não "impor" o escuro no claro.
 */
function resolveTheme(mode) {
  if (mode === 'dark' || mode === 'light') return mode;
  return window.matchMedia?.('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}

/**
 * Aplica o tema. Em `system`, escuta mudanças do SO em tempo real.
 * @param {'dark'|'light'|'system'} mode
 */
function applyTheme(mode) {
  const root = document.documentElement;

  const paint = () => {
    const resolved = resolveTheme(mode);
    root.classList.toggle('dark', resolved === 'dark');
    root.classList.toggle('light', resolved === 'light');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', resolved === 'light' ? '#f6f6f8' : '#0b0b0f');
  };

  paint();

  // Remove listener anterior para não acumular trocas de tema.
  if (mediaQuery && mediaHandler) mediaQuery.removeEventListener('change', mediaHandler);
  mediaQuery = null;
  mediaHandler = null;

  if (mode === 'system') {
    mediaQuery = window.matchMedia('(prefers-color-scheme: light)');
    mediaHandler = () => paint();
    mediaQuery.addEventListener('change', mediaHandler);
  }
}

/** Aplica a cor de destaque (CSS vars). */
function applyAccent(name) {
  const palette = ACCENTS[name] ?? ACCENTS.violet;
  const root = document.documentElement;
  root.style.setProperty('--accent', palette.base);
  root.style.setProperty('--accent-strong', palette.strong);
  root.style.setProperty('--accent-soft', palette.soft);
}
return { ACCENTS: ACCENTS, applyTheme: applyTheme, applyAccent: applyAccent };
})();
